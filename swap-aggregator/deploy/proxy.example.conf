# PROVISIONAL Nginx host-proxy EXAMPLE. Merge into existing HTTPS config only
# after infrastructure review and separate deployment approval. Not an installer.
# http {} context:
limit_req_zone $binary_remote_addr zone=hermes_quotes:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=hermes_status:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=hermes_tokens:1m rate=40r/m;
log_format hermes_min '$msec $request_method $status $request_time';

server {
    listen 443 ssl;
    server_name hermes.example; # replace with the ONE canonical public domain
    ssl_certificate /EXISTING/PROXY/CERTIFICATE;
    ssl_certificate_key /EXISTING/PROXY/PRIVATE_KEY;
    access_log /var/log/nginx/hermes-access.log hermes_min;
    # Default Nginx errors can include requests/IPs: retain protected diagnostics
    # only after choosing a policy. Application logs are already minimized.
    error_log /var/log/nginx/hermes-error.log crit;
    client_max_body_size 4k;
    client_body_buffer_size 4k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 15s;
    limit_req_status 429;

    # Host/protocol/IP overwrite incoming values. Do not append untrusted XFF.
    proxy_set_header Host hermes.example;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Hermes-Client-IP $remote_addr;
    proxy_read_timeout 35s;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;

    location ^~ /api/security/ { return 410; }
    location ~ ^/api/(rango/status|oneclick/status)$ {
        limit_req zone=hermes_status burst=8 nodelay;
        proxy_pass http://127.0.0.1:3187;
    }
    location ~ ^/api/(rango/(quote|swap)|oneclick/quote)$ {
        limit_req zone=hermes_quotes burst=4 nodelay;
        proxy_pass http://127.0.0.1:3187;
    }
    location ^~ /api/tokens/ {
        limit_req zone=hermes_tokens burst=12 nodelay;
        proxy_pass http://127.0.0.1:3187;
    }
    location / { proxy_pass http://127.0.0.1:3187; }
}
# Existing default virtual host must reject unknown Host values. If another
# proxy/CDN precedes Nginx, configure its authenticated IP ranges explicitly;
# never trust public real_ip/XFF headers. HERMES_TRUST_PROXY=true requires this.
