# PROVISIONAL Docker Standalone profile, one instance, proxy running on the host.
# Portainer: upload this file and supply stack variables. No env_file/Swarm assumption.
# Containerized proxy alternative is documented in DEPLOYMENT.md.
services:
  hermes:
    image: ${HERMES_IMAGE:?Provide an immutable Hermes image tag@sha256 digest}
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:3187:3000"
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:size=32m,uid=10001,gid=10001,mode=0700
    mem_limit: 768m
    cpus: "1.0"
    pids_limit: 128
    stop_grace_period: 30s
    environment:
      HERMES_PUBLIC_ORIGIN: ${HERMES_PUBLIC_ORIGIN:?Provide the canonical HTTPS origin}
      # Enable only when the proxy overwrites x-hermes-client-ip and direct access is impossible.
      HERMES_TRUST_PROXY: ${HERMES_TRUST_PROXY:-false}
      HERMES_EXECUTION_DISABLED: ${HERMES_EXECUTION_DISABLED:-true}
      HERMES_API_LOGS: ${HERMES_API_LOGS:-false}
      LIFI_API_KEY: ${LIFI_API_KEY:-}
      RANGO_API_KEY: ${RANGO_API_KEY:-}
      RANGO_REFERRER_ADDRESS: ${RANGO_REFERRER_ADDRESS:-}
      NEAR_1CLICK_API_KEY: ${NEAR_1CLICK_API_KEY:-}
      NEAR_1CLICK_JWT: ${NEAR_1CLICK_JWT:-}
      LIFI_SERVER_REQUESTS_PER_MINUTE: ${LIFI_SERVER_REQUESTS_PER_MINUTE:-120}
      TOKEN_SEARCH_REQUESTS_PER_MINUTE: ${TOKEN_SEARCH_REQUESTS_PER_MINUTE:-60}
      CG_API_KEY: ${CG_API_KEY:-}
      CG_API_TIER: ${CG_API_TIER:-demo}
      CMC_API_KEY: ${CMC_API_KEY:-}
      TOP_ASSET_PRIMARY_PROVIDER: ${TOP_ASSET_PRIMARY_PROVIDER:-coingecko}
      TOP_ASSET_FETCH_LIMIT: ${TOP_ASSET_FETCH_LIMIT:-120}
      TARGET_UNIVERSE_SIZE: ${TARGET_UNIVERSE_SIZE:-100}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
